    Properties:
      Family: !Sub ${EnvironmentName}-restaurant-app
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: restaurant-app
          Image: !Ref RestaurantImageUri
          Essential: true
          PortMappings: [{ContainerPort: 80}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref RestaurantLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: ecs}}
          HealthCheck: {Command: [CMD-SHELL, 'wget -qO- http://localhost/ >/dev/null || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 15}

  DeliveryTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-delivery-app
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: delivery-app
          Image: !Ref DeliveryImageUri
          Essential: true
          PortMappings: [{ContainerPort: 80}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref DeliveryLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: ecs}}
          HealthCheck: {Command: [CMD-SHELL, 'wget -qO- http://localhost/ >/dev/null || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 15}

  AdminTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-admin-panel
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: admin-panel
          Image: !Ref AdminImageUri
          Essential: true
          PortMappings: [{ContainerPort: 80}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref AdminLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: ecs}}
          HealthCheck: {Command: [CMD-SHELL, 'wget -qO- http://localhost/ >/dev/null || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 15}

  AuthService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: auth-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref AuthTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ContainerName: auth-service, ContainerPort: 4003, TargetGroupArn: !Ref AuthApiTargetGroupArn}]

  OrderService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: order-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref OrderTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ContainerName: order-service, ContainerPort: 4000, TargetGroupArn: !Ref OrderApiTargetGroupArn}]

  PaymentService:
