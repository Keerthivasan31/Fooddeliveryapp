    Properties:
      ServiceName: auth-app
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref AuthAppTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ContainerName: auth-app, ContainerPort: 80, TargetGroupArn: !Ref AuthAppTargetGroupArn}]

  CustomerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: customer-app
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref CustomerTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ContainerName: customer-app, ContainerPort: 80, TargetGroupArn: !Ref CustomerTargetGroupArn}]

  RestaurantService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: restaurant-app
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref RestaurantTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ContainerName: restaurant-app, ContainerPort: 80, TargetGroupArn: !Ref RestaurantTargetGroupArn}]

  DeliveryService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: delivery-app
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref DeliveryTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ContainerName: delivery-app, ContainerPort: 80, TargetGroupArn: !Ref DeliveryTargetGroupArn}]

  AdminService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: admin-panel
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref AdminTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ContainerName: admin-panel, ContainerPort: 80, TargetGroupArn: !Ref AdminTargetGroupArn}]

Outputs:
  ECSClusterName: {Value: !Ref ECSCluster}
  AuthServiceName: {Value: !Ref AuthService}
  OrderServiceName: {Value: !Ref OrderService}
  PaymentServiceName: {Value: !Ref PaymentService}
  TrackingServiceName: {Value: !Ref TrackingService}
  CatalogServiceName: {Value: !Ref CatalogService}
  AuthAppServiceName: {Value: !Ref AuthAppService}
  CustomerServiceName: {Value: !Ref CustomerService}
  RestaurantServiceName: {Value: !Ref RestaurantService}
  DeliveryServiceName: {Value: !Ref DeliveryService}
  AdminServiceName: {Value: !Ref AdminService}
