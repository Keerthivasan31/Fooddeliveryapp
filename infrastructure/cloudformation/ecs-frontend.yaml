    Properties:
      Family: !Sub ${EnvironmentName}-auth-app
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: auth-app
          Image: !Ref AuthAppImageUri
          Essential: true
          PortMappings: [{ContainerPort: 80}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref AuthAppLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: ecs}}
          HealthCheck: {Command: [CMD-SHELL, 'wget -qO- http://localhost/ >/dev/null || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 15}

  CustomerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-customer-app
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: customer-app
          Image: !Ref CustomerImageUri
          Essential: true
          PortMappings: [{ContainerPort: 80}]
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref CustomerLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: ecs}}
          HealthCheck: {Command: [CMD-SHELL, 'wget -qO- http://localhost/ >/dev/null || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 15}

  RestaurantTaskDefinition:
