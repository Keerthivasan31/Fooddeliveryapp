    Properties:
      ServiceName: tracking-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TrackingTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AppSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers: [{ContainerName: tracking-service, ContainerPort: 4002, TargetGroupArn: !Ref TrackingApiTargetGroupArn}]

  CatalogService:
