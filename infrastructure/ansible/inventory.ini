# Populate dynamically from AWS EC2 (see aws_ec2.yaml) or statically for a
# fixed set of backend servers, as required by the project spec item #11.
[backend_servers]
backend1 ansible_host=10.0.1.10
backend2 ansible_host=10.0.1.11
backend3 ansible_host=10.0.1.12

[backend_servers:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/food-delivery-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
