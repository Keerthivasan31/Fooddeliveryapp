---
- name: Create application directory
  file:
    path: /opt/food-delivery
    state: directory
    owner: ec2-user
    group: ec2-user
  become: true

- name: Template environment file for backend services
  template:
    src: env.j2
    dest: /opt/food-delivery/.env
    owner: ec2-user
  become: true

- name: Login to ECR
  shell: |
    aws ecr get-login-password --region {{ aws_region }} | \
    docker login --username AWS --password-stdin {{ ecr_registry }}
  become: true

- name: Pull latest order-service image
  command: docker pull {{ ecr_registry }}/order-service:latest
  become: true

- name: Run order-service container
  docker_container:
    name: order-service
    image: "{{ ecr_registry }}/order-service:latest"
    state: started
    restart_policy: always
    ports:
      - "4000:4000"
    env_file: /opt/food-delivery/.env
  become: true
