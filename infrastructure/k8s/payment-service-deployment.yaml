apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: food-delivery
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: <ECR_REPO_URI>/payment-service:latest
          ports:
            - containerPort: 4001
          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service:4000"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: food-delivery
spec:
  selector:
    app: payment-service
  ports:
    - port: 4001
      targetPort: 4001
  type: ClusterIP
