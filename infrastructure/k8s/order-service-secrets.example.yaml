# Example only - do NOT commit real secrets. In practice these are created via
# `kubectl create secret` sourced from AWS Secrets Manager (e.g. using the
# External Secrets Operator), never checked into version control.
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  namespace: food-delivery
type: Opaque
stringData:
  DB_HOST: "orders-db.xxxxx.us-east-1.rds.amazonaws.com"
  DB_USER: "orders_user"
  DB_PASSWORD: "change_me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: food-delivery
data:
  DB_PORT: "5432"
  DB_NAME: "orders_db"
  DB_SSL: "true"
  AWS_REGION: "us-east-1"
  ORDER_ALERTS_TOPIC_ARN: "arn:aws:sns:us-east-1:xxxxxxxxxxxx:order-alerts"
