apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: food-delivery
  labels:
    app: tracking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
    spec:
      containers:
        - name: tracking-service
          image: <ECR_REPO_URI>/tracking-service:latest
          ports:
            - containerPort: 4002
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: food-delivery
spec:
  selector:
    app: tracking-service
  ports:
    - port: 4002
      targetPort: 4002
  type: ClusterIP
