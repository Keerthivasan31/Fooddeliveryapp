services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/order-service/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./services/auth-service/src/db/init.sql:/docker-entrypoint-initdb.d/02-auth.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: ./services/order-service
    ports:
      - "4000:4000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: orders_user
      DB_PASSWORD: orders_pass
      DB_NAME: orders_db
      DB_SSL: "false"
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      ORDER_SERVICE_URL: http://order-service:4000
    depends_on:
      - order-service

  tracking-service:
    build: ./services/tracking-service
    ports:
      - "4002:4002"
    environment:
      PORT: 4002

  catalog-service:
    build: ./services/catalog-service
    ports:
      - "4004:4004"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: orders_user
      DB_PASSWORD: orders_pass
      DB_NAME: orders_db
      DB_SSL: "false"
      PORT: 4004
      PUBLIC_BASE_URL: http://localhost:4004
      JWT_SECRET: local-development-secret-change-in-production
    volumes:
      - catalog_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build: ./services/auth-service
    ports:
      - "4003:4003"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: orders_user
      DB_PASSWORD: orders_pass
      DB_NAME: orders_db
      DB_SSL: "false"
      JWT_SECRET: local-development-secret-change-in-production
      PORT: 4003
      ADMIN_EMAIL: admin@fooddelivery.local
      ADMIN_PASSWORD: Admin@12345
      ADMIN_NAME: Platform Admin
      PUBLIC_BASE_URL: http://localhost:4003
    volumes:
      - auth_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  auth-app:
    build:
      context: ./apps/auth-app
      args:
        VITE_AUTH_API_URL: http://localhost:4003
        VITE_CUSTOMER_APP_URL: http://localhost:9001
        VITE_RESTAURANT_APP_URL: http://localhost:9002
        VITE_DELIVERY_APP_URL: http://localhost:9003
        VITE_ADMIN_APP_URL: http://localhost:9004
    ports:
      - "9000:80"
    environment: {}
    depends_on:
      - auth-service

  customer-app:
    build:
      context: ./apps/customer-app
      args:
        VITE_AUTH_API_URL: http://localhost:4003
        VITE_ORDER_SERVICE_URL: http://localhost:4000
        VITE_PAYMENT_SERVICE_URL: http://localhost:4001
        VITE_TRACKING_SERVICE_URL: http://localhost:4002
        VITE_CATALOG_SERVICE_URL: http://localhost:4004
        VITE_RESTAURANT_ID: 11111111-1111-1111-1111-111111111111
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "9001:80"
    depends_on:
      - order-service
      - payment-service
      - tracking-service
      - catalog-service

  restaurant-app:
    build:
      context: ./apps/restaurant-app
      args:
        VITE_AUTH_API_URL: http://localhost:4003
        VITE_RESTAURANT_ID: 11111111-1111-1111-1111-111111111111
        VITE_ORDER_SERVICE_URL: http://localhost:4000
        VITE_CATALOG_SERVICE_URL: http://localhost:4004
    ports:
      - "9002:80"
    depends_on:
      - order-service
      - catalog-service

  delivery-app:
    build:
      context: ./apps/delivery-app
      args:
        VITE_AUTH_API_URL: http://localhost:4003
    ports:
      - "9003:80"
    depends_on:
      - order-service
      - tracking-service

  admin-panel:
    build:
      context: ./apps/admin-panel
      args:
        VITE_AUTH_API_URL: http://localhost:4003
        VITE_CATALOG_SERVICE_URL: http://localhost:4004
        VITE_ORDER_SERVICE_URL: http://localhost:4000
    ports:
      - "9004:80"
    depends_on:
      - order-service
      - catalog-service

volumes:
  pgdata:
  catalog_uploads:
  auth_uploads:
